name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /fahry-portfolio
      NEXT_PUBLIC_SITE_URL: https://freirennly.github.io/fahry-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: |
          npx next build --webpack
          if [ -f out/404/index.html ]; then cp out/404/index.html out/404.html; fi

      - name: Verify static export output
        run: |
          test -f out/index.html || { echo "Missing out/index.html"; exit 1; }
          test -f out/404.html || { echo "Missing out/404.html"; exit 1; }
          test -f out/work/kalanata/index.html || { echo "Missing out/work/kalanata/index.html"; exit 1; }
          test -f out/work/kinarya/index.html || { echo "Missing out/work/kinarya/index.html"; exit 1; }
          test -f out/work/pkkmb-fkip-uns-2025/index.html || { echo "Missing out/work/pkkmb-fkip-uns-2025/index.html"; exit 1; }
          echo "Static export verification passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
